name: fixit_iraq
description: FixIt Iraq - Local services marketplace for Erbil, Kurdistan Region. Connects customers with verified local service providers.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Supabase
  supabase_flutter: ^1.10.0

  # Networking
  http: ^1.1.0
  dio: ^5.3.0

  # Storage & Hive
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # Location & Maps
  geolocator: ^9.0.2
  google_maps_flutter: ^2.5.0

  # Image handling
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.0

  # UI Components
  flutter_svg: ^2.0.0
  iconsax: ^0.0.8
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0
  lottie: ^2.7.0

  # Date & Time
  intl_utils: ^2.8.5

  # Error handling
  fpdart: ^1.1.0

  # Logging
  logger: ^2.0.0

  # Device info
  device_info_plus: ^9.0.0
  package_info_plus: ^4.1.0

  # Notifications
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0

  # Deep linking
  uni_links: ^0.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  # Localization
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/locales/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
    - family: Droid Kufi
      fonts:
        - asset: assets/fonts/DroidKufi-Regular.ttf
        - asset: assets/fonts/DroidKufi-Bold.ttf
          weight: 700

flutter_gen:
  output: lib/gen
  line_length: 80
